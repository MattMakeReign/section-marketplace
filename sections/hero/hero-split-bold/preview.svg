<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Hero — Split Bold preview">
  <!--
    Procedural preview placeholder. Suggests the layout structure of the
    Hero — Split Bold section: oversized headline left, supporting copy +
    CTA pair right. Replace with a real screenshot once available.
  -->
  <rect width="1600" height="900" fill="#fdfcfc"/>

  <!-- Hairline section frame -->
  <rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#e5e5e5" stroke-width="1"/>

  <!-- 12-col grid hint (left margin 96, right margin 96) -->
  <g stroke="#f0eeea" stroke-width="1">
    <line x1="800" y1="80" x2="800" y2="820"/>
  </g>

  <!-- Eyebrow / category label -->
  <text x="96" y="172" font-family="ui-sans-serif, system-ui" font-size="13" font-weight="500" letter-spacing="0.7" fill="#a59f97">SECTION 01 · HERO</text>

  <!-- Display headline (left column) — 4 lines of bold display type, simulated as solid rectangles in obsidian -->
  <g fill="#000000">
    <rect x="96" y="220" width="600" height="68" rx="2"/>
    <rect x="96" y="312" width="640" height="68" rx="2"/>
    <rect x="96" y="404" width="500" height="68" rx="2"/>
  </g>

  <!-- Right column, supporting copy lines (gravel) -->
  <g fill="#777169">
    <rect x="864" y="232" width="552" height="14" rx="1"/>
    <rect x="864" y="262" width="600" height="14" rx="1"/>
    <rect x="864" y="292" width="480" height="14" rx="1"/>
    <rect x="864" y="322" width="544" height="14" rx="1"/>
  </g>

  <!-- Right column, CTA pair -->
  <g>
    <!-- Primary CTA — obsidian -->
    <rect x="864" y="404" width="200" height="52" rx="6" fill="#000000"/>
    <text x="964" y="437" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="15" font-weight="500" fill="#fdfcfc">Primary action</text>

    <!-- Secondary CTA — hairline -->
    <rect x="1080" y="404" width="180" height="52" rx="6" fill="none" stroke="#000000" stroke-width="1.5"/>
    <text x="1170" y="437" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="15" font-weight="500" fill="#000000">Secondary</text>
  </g>

  <!-- Bottom spec strip (chrome footer style) -->
  <line x1="96" y1="780" x2="1504" y2="780" stroke="#e5e5e5"/>
  <text x="96" y="816" font-family="ui-sans-serif, system-ui" font-size="12" font-weight="500" letter-spacing="0.7" fill="#a59f97">HERO · SPLIT BOLD · v1.0.0 · STABLE</text>
  <text x="1504" y="816" text-anchor="end" font-family="ui-sans-serif, system-ui" font-size="12" font-weight="500" letter-spacing="0.7" fill="#a59f97">EDITORIAL · AGENCY · PORTFOLIO</text>
</svg>
