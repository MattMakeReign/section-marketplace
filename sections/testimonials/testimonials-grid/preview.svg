<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Testimonials — Grid preview">
  <!--
    Procedural preview placeholder. Suggests the layout structure of the
    Testimonials — Grid section: three equal-height testimonial cards
    side by side at desktop widths. Replace with a real screenshot once
    available.
  -->
  <rect width="1600" height="900" fill="#fdfcfc"/>

  <!-- Hairline section frame -->
  <rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Eyebrow -->
  <text x="96" y="172" font-family="ui-sans-serif, system-ui" font-size="13" font-weight="500" letter-spacing="0.7" fill="#a59f97">SECTION 03 · TESTIMONIALS</text>

  <!-- Section heading + supporting -->
  <g fill="#000000">
    <rect x="96" y="200" width="540" height="40" rx="2"/>
  </g>
  <g fill="#777169">
    <rect x="96" y="260" width="600" height="14" rx="1"/>
    <rect x="96" y="284" width="480" height="14" rx="1"/>
  </g>

  <!-- Three-up grid -->
  <g>
    <!-- Card 1 -->
    <g>
      <rect x="96" y="376" width="448" height="320" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
      <!-- Body -->
      <g fill="#000000">
        <rect x="128" y="424" width="384" height="14" rx="1"/>
        <rect x="128" y="450" width="364" height="14" rx="1"/>
        <rect x="128" y="476" width="384" height="14" rx="1"/>
        <rect x="128" y="502" width="280" height="14" rx="1"/>
      </g>
      <!-- Divider -->
      <line x1="128" y1="588" x2="156" y2="588" stroke="#000000" stroke-width="1.5"/>
      <text x="128" y="618" font-family="ui-sans-serif, system-ui" font-size="14" font-weight="500" fill="#000000">Person Name</text>
      <text x="128" y="640" font-family="ui-sans-serif, system-ui" font-size="13" fill="#777169">Role · Company</text>
    </g>

    <!-- Card 2 -->
    <g>
      <rect x="572" y="376" width="448" height="320" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
      <g fill="#000000">
        <rect x="604" y="424" width="384" height="14" rx="1"/>
        <rect x="604" y="450" width="356" height="14" rx="1"/>
        <rect x="604" y="476" width="384" height="14" rx="1"/>
      </g>
      <line x1="604" y1="588" x2="632" y2="588" stroke="#000000" stroke-width="1.5"/>
      <text x="604" y="618" font-family="ui-sans-serif, system-ui" font-size="14" font-weight="500" fill="#000000">Person Name</text>
      <text x="604" y="640" font-family="ui-sans-serif, system-ui" font-size="13" fill="#777169">Role · Company</text>
    </g>

    <!-- Card 3 -->
    <g>
      <rect x="1048" y="376" width="448" height="320" rx="6" fill="#ffffff" stroke="#e5e5e5"/>
      <g fill="#000000">
        <rect x="1080" y="424" width="384" height="14" rx="1"/>
        <rect x="1080" y="450" width="372" height="14" rx="1"/>
        <rect x="1080" y="476" width="324" height="14" rx="1"/>
        <rect x="1080" y="502" width="384" height="14" rx="1"/>
      </g>
      <line x1="1080" y1="588" x2="1108" y2="588" stroke="#000000" stroke-width="1.5"/>
      <text x="1080" y="618" font-family="ui-sans-serif, system-ui" font-size="14" font-weight="500" fill="#000000">Person Name</text>
      <text x="1080" y="640" font-family="ui-sans-serif, system-ui" font-size="13" fill="#777169">Role · Company</text>
    </g>
  </g>

  <!-- Bottom spec strip -->
  <line x1="96" y1="780" x2="1504" y2="780" stroke="#e5e5e5"/>
  <text x="96" y="816" font-family="ui-sans-serif, system-ui" font-size="12" font-weight="500" letter-spacing="0.7" fill="#a59f97">TESTIMONIALS · GRID · v1.0.0 · STABLE</text>
  <text x="1504" y="816" text-anchor="end" font-family="ui-sans-serif, system-ui" font-size="12" font-weight="500" letter-spacing="0.7" fill="#a59f97">SOCIAL-PROOF · 3-UP</text>
</svg>
